<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลานจอดรถอัจฉริยะ (3 อาคาร)</title>
  <style>
    :root {
      --bg-main: #121822;
      --bg-header: #202733;
      --bg-card: #1b222e;
      --border-card: #2d3748;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --red: #f05252;
      --green: #31c48d;
      --amber: #fbbf24;
      --blue-btn: #1c64f2;
      --blue-btn-hover: #1a56db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 36px;
    }

    /* Header */
    .header {
      background-color: var(--bg-header);
      padding: 18px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-card);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .summary-title {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 2.3rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .summary-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .text-red { color: var(--red); }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }

    /* Section Title */
    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 18px 0 14px;
      line-height: 1.5;
      color: #f1f5f9;
    }

    /* Control Bar */
    .control-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }

    .btn-sim {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      color: #e2e8f0;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-sim.active {
      border-color: var(--green);
      color: var(--green);
      background-color: rgba(49, 196, 141, 0.12);
    }

    /* Garage Card */
    .garage-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .garage-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 18px;
    }

    .garage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .garage-name {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid;
    }

    .badge-green {
      color: var(--green);
      border-color: var(--green);
      background-color: rgba(49, 196, 141, 0.1);
    }

    .badge-amber {
      color: var(--amber);
      border-color: var(--amber);
      background-color: rgba(251, 191, 36, 0.1);
    }

    .badge-red {
      color: var(--red);
      border-color: var(--red);
      background-color: rgba(240, 82, 82, 0.1);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #0f141d;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease, background-color 0.3s ease;
    }

    .garage-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: #cbd5e1;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--blue-btn);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--blue-btn-hover);
    }

    /* Detail View */
    .hidden { display: none; }

    .detail-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .btn-back {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .detail-header-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    /* 50 Slots Grid */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .slot-box {
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      border: 1px solid;
      transition: transform 0.1s, background-color 0.2s;
      user-select: none;
    }

    .slot-box:active {
      transform: scale(0.95);
    }

    .slot-free {
      background-color: rgba(49, 196, 141, 0.1);
      border-color: rgba(49, 196, 141, 0.5);
      color: var(--green);
    }

    .slot-occupied {
      background-color: rgba(240, 82, 82, 0.15);
      border-color: rgba(240, 82, 82, 0.6);
      color: var(--red);
    }

    .slot-icon {
      font-size: 1.15rem;
      display: block;
      margin-bottom: 2px;
    }

    .slot-code {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .slot-status-text {
      font-size: 0.68rem;
      opacity: 0.9;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>ลานจอดรถอัจฉริยะ (3 อาคาร)</h1>
  </header>

  <main class="container">
    <!-- หน้าหลัก -->
    <section id="dashboardView">
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-title">รถจอดอยู่ทั้งหมด (3 โรง)</div>
          <div class="summary-value text-red" id="totalOccupied">0</div>
          <div class="summary-sub">จากทั้งหมด 150 คัน</div>
        </div>
        <div class="summary-card">
          <div class="summary-title">ช่องว่างทั้งหมด (3 โรง)</div>
          <div class="summary-value text-green" id="totalFree">150</div>
          <div class="summary-sub">ช่อง</div>
        </div>
      </div>

      <div class="control-bar">
        <button class="btn-sim" id="autoSimBtn" onclick="toggleAutoSim()">▶ จำลองรถเข้า-ออกอัตโนมัติ</button>
        <button class="btn-sim" style="flex: 0.45;" onclick="resetAll()">รีเซ็ต (ว่าง 150)</button>
      </div>

      <div class="section-title">
        🏢 เลือกโรงจอดรถที่ต้องการดูรายละเอียด (โรงละ 50 คัน)
      </div>

      <div class="garage-list" id="garageList"></div>
    </section>

    <!-- หน้ารายละเอียดช่องจอด 50 ช่อง -->
    <section id="detailView" class="hidden">
      <div class="detail-nav">
        <button class="btn-back" onclick="showDashboard()">← กลับหน้าหลัก</button>
        <button class="btn-sim" style="flex: unset;" onclick="randomFillGarage()">สุ่มรถเข้าจอดโรงนี้</button>
      </div>

      <div class="detail-header-card">
        <div class="garage-top" style="margin-bottom: 10px;">
          <div class="garage-name" id="detailTitle">🏢 โรงจอดรถที่ 1</div>
          <span class="badge badge-green" id="detailBadge">ว่างเยอะ</span>
        </div>
        <div class="garage-stats" style="margin-bottom: 8px;">
          <span>จอดแล้ว: <strong class="text-red" id="detailOccupied">0</strong> คัน</span>
          <span>ว่าง: <strong class="text-green" id="detailFree">50</strong> / 50</span>
        </div>
        <div class="progress-track" style="margin-bottom: 8px;">
          <div class="progress-fill" id="detailProgress" style="width: 0%;"></div>
        </div>
        <div class="legend">
          <div class="legend-item"><span class="dot" style="background: var(--green);"></span> ว่าง (กดเพื่อนำรถเข้าจอด)</div>
          <div class="legend-item"><span class="dot" style="background: var(--red);"></span> มีรถจอด (กดเพื่อนำรถออก)</div>
        </div>
      </div>

      <div class="slots-grid" id="slotsGrid"></div>

      <div class="detail-actions">
        <button class="btn-sim" onclick="clearCurrentGarage()">เคลียร์รถโรงนี้ให้ว่างทั้งหมด</button>
      </div>
    </section>
  </main>

  <script>
    const SLOTS_PER_GARAGE = 50;

    // สร้างข้อมูล 3 โรง โรงละ 50 ช่อง (false = ว่าง, true = มีรถจอด)
    let garages = [
      { id: 1, name: "โรงจอดรถที่ 1", prefix: "A", slots: Array(SLOTS_PER_GARAGE).fill(false) },
      { id: 2, name: "โรงจอดรถที่ 2", prefix: "B", slots: Array(SLOTS_PER_GARAGE).fill(false) },
      { id: 3, name: "โรงจอดรถที่ 3", prefix: "C", slots: Array(SLOTS_PER_GARAGE).fill(false) }
    ];

    let activeGarageId = null;
    let autoSimTimer = null;

    function getStatus(occupiedCount) {
      const free = SLOTS_PER_GARAGE - occupiedCount;
      if (free === 0) return { label: "เต็มแล้ว", badgeCls: "badge-red", barColor: "#f05252" };
      if (free <= 10) return { label: "ใกล้เต็ม", badgeCls: "badge-amber", barColor: "#fbbf24" };
      if (free <= 25) return { label: "ปานกลาง", badgeCls: "badge-amber", barColor: "#31c48d" };
      return { label: "ว่างเยอะ", badgeCls: "badge-green", barColor: "#31c48d" };
    }

    function renderDashboard() {
      let totalOccupied = 0;
      const totalCapacity = garages.length * SLOTS_PER_GARAGE;

      const listEl = document.getElementById("garageList");
      listEl.innerHTML = garages.map(g => {
        const occupied = g.slots.filter(Boolean).length;
        const free = SLOTS_PER_GARAGE - occupied;
        const pct = (occupied / SLOTS_PER_GARAGE) * 100;
        const status = getStatus(occupied);
        totalOccupied += occupied;

        return `
          <div class="garage-card">
            <div class="garage-top">
              <div class="garage-name">🏢 ${g.name}</div>
              <span class="badge ${status.badgeCls}">${status.label}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${pct}%; background-color: ${status.barColor};"></div>
            </div>
            <div class="garage-stats">
              <span>จอดแล้ว: <strong class="text-red">${occupied}</strong> คัน</span>
              <span>ว่าง: <strong class="text-green">${free}</strong> / ${SLOTS_PER_GARAGE}</span>
            </div>
            <button class="btn-primary" onclick="openGarage(${g.id})">
              กดเพื่อเข้าดูช่องจอด →
            </button>
          </div>
        `;
      }).join("");

      document.getElementById("totalOccupied").textContent = totalOccupied;
      document.getElementById("totalFree").textContent = totalCapacity - totalOccupied;

      if (activeGarageId !== null) {
        renderDetail();
      }
    }

    function openGarage(id) {
      activeGarageId = id;
      document.getElementById("dashboardView").classList.add("hidden");
      document.getElementById("detailView").classList.remove("hidden");
      window.scrollTo(0, 0);
      renderDetail();
    }

    function showDashboard() {
      activeGarageId = null;
      document.getElementById("detailView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function renderDetail() {
      const garage = garages.find(g => g.id === activeGarageId);
      if (!garage) return;

      const occupied = garage.slots.filter(Boolean).length;
      const free = SLOTS_PER_GARAGE - occupied;
      const pct = (occupied / SLOTS_PER_GARAGE) * 100;
      const status = getStatus(occupied);

      document.getElementById("detailTitle").textContent = "🏢 " + garage.name;
      const badgeEl = document.getElementById("detailBadge");
      badgeEl.className = "badge " + status.badgeCls;
      badgeEl.textContent = status.label;

      document.getElementById("detailOccupied").textContent = occupied;
      document.getElementById("detailFree").textContent = free;
      const prog = document.getElementById("detailProgress");
      prog.style.width = pct + "%";
      prog.style.backgroundColor = status.barColor;

      const gridEl = document.getElementById("slotsGrid");
      gridEl.innerHTML = garage.slots.map((isOccupied, idx) => {
        const num = String(idx + 1).padStart(2, "0");
        const code = ${garage.prefix}${num};
        return `
          <div class="slot-box ${isOccupied ? "slot-occupied" : "slot-free"}" onclick="toggleSlot(${idx})">
            <span class="slot-icon">${isOccupied ? "🚗" : "🅿️"}</span>
            <div class="slot-code">${code}</div>
            <div class="slot-status-text">${isOccupied ? "จอดแล้ว" : "ว่าง"}</div>
          </div>
        `;
      }).join("");
    }

    function toggleSlot(slotIndex) {
      const garage = garages.find(g => g.id === activeGarageId);
      if (!garage) return;
      garage.slots[slotIndex] = !garage.slots[slotIndex];
      renderDashboard();
    }

    function randomFillGarage() {
      const garage = garages.find(g => g.id === activeGarageId);
      if (!garage) return;
      garage.slots = garage.slots.map(() => Math.random() < 0.45);
      renderDashboard();
    }

    function clearCurrentGarage() {
      const garage = garages.find(g => g.id === activeGarageId);
      if (!garage) return;
      garage.slots.fill(false);
      renderDashboard();
    }

    function resetAll() {
      garages.forEach(g => g.slots.fill(false));
      renderDashboard();
    }

    function toggleAutoSim() {
      const btn = document.getElementById("autoSimBtn");
      if (autoSimTimer) {
        clearInterval(autoSimTimer);
        autoSimTimer = null;
        btn.classList.remove("active");
        btn.textContent = "▶ จำลองรถเข้า-ออกอัตโนมัติ";
      } else {
        btn.classList.add("active");
        btn.textContent = "⏸ กำลังจำลอง (กดเพื่อหยุด)";
        autoSimTimer = setInterval(() => {
          // สุ่มสลับสถานะ 1-3 ช่องต่อรอบ
          const changes = Math.floor(Math.random() * 3) + 1;
          for (let i = 0; i < changes; i++) {
            const g = garages[Math.floor(Math.random() * garages.length)];
            const idx = Math.floor(Math.random() * SLOTS_PER_GARAGE);
            g.slots[idx] = !g.slots[idx];
          }
          renderDashboard();
        }, 900);
      }
    }

    renderDashboard();
  </script>
</body>
</html>
